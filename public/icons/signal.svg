<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Sinal emanando de um ponto central — pessoa transmitindo presença.
    Diferente do WiFi padrão (base horizontal), aqui os arcos partem de
    um ponto (12, 20), lendo como "emitir" — o conceito central do Emetis.
  -->
  <!-- Arco interno -->
  <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
  <!-- Arco médio -->
  <path d="M5 13a9 9 0 0 1 14 0"/>
  <!-- Arco externo -->
  <path d="M1.5 9.5a14 14 0 0 1 21 0"/>
  <!-- Ponto de emissão — a pessoa / o beacon -->
  <circle cx="12" cy="20" r="1.3" fill="currentColor" stroke="none"/>
</svg>
