<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3FA0"/>
      <stop offset="100%" stop-color="#0B1D4E"/>
    </linearGradient>
  </defs>

  <!-- Fundo horizontal -->
  <rect width="440" height="100" rx="20" fill="url(#bg)"/>

  <!--
    Marca "e" inline — sem fundo próprio, traço branco sobre o gradiente.
    Usa viewBox aninhado para escalar o mesmo "e" do ícone (512×512)
    para um espaço de 64×64 px posicionado em (18, 18).
    ViewBox "80 80 360 360" enquadra a marca com margem de stroke.
  -->
  <svg x="18" y="18" width="64" height="64" viewBox="80 80 360 360">
    <path
      d="M 336 176 A 113 113 0 1 0 336 336"
      stroke="white"
      stroke-width="44"
      stroke-linecap="round"
      fill="none"
    />
    <line
      x1="143" y1="256"
      x2="343" y2="256"
      stroke="white"
      stroke-width="44"
      stroke-linecap="round"
    />
    <circle cx="336" cy="176" r="34" fill="#F59E0B"/>
    <circle cx="336" cy="336" r="20" fill="#F59E0B" opacity="0.45"/>
  </svg>

  <!-- Logotipo textual: "emetis" lowercase, peso 600, tracking ligeiramente apertado -->
  <text
    x="97"
    y="63"
    font-family="'DM Sans', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="44"
    font-weight="600"
    letter-spacing="-0.5"
    fill="white"
  >emetis</text>
</svg>
