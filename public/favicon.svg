<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo navy arredondado -->
  <rect width="32" height="32" rx="7" fill="#0B1D4E"/>
  <!-- "e" mark escalado: centro (16,16), raio 7 -->
  <!-- Arco 270° anti-horário -->
  <path d="M 21 11 A 7 7 0 1 0 21 21"
        stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Barra horizontal -->
  <line x1="9" y1="16" x2="21.4" y2="16"
        stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Alef — ponto âmbar -->
  <circle cx="21" cy="11" r="2.2" fill="#F59E0B"/>
  <!-- Tav — eco sutil -->
  <circle cx="21" cy="21" r="1.3" fill="#F59E0B" opacity="0.45"/>
</svg>
