<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Fundo azul com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!--
    Torre de sinal centralizada:
    Pilar vertical central + arcos em ambos os lados
    Centro: 256, 256
  -->

  <!-- Pilar vertical centralizado -->
  <rect x="233" y="96" width="46" height="240" rx="23" fill="white"/>

  <!-- Ponto base — a pessoa, o indivíduo -->
  <circle cx="256" cy="374" r="26" fill="white"/>

  <!-- Arco 1 esquerdo — fé pessoal -->
  <path d="M 233 192 A 60 60 0 0 0 233 272"
        stroke="white" stroke-opacity="0.95" stroke-width="22" stroke-linecap="round"/>
  <!-- Arco 1 direito — fé pessoal -->
  <path d="M 279 192 A 60 60 0 0 1 279 272"
        stroke="white" stroke-opacity="0.95" stroke-width="22" stroke-linecap="round"/>

  <!-- Arco 2 esquerdo — célula -->
  <path d="M 233 148 A 108 108 0 0 0 233 316"
        stroke="white" stroke-opacity="0.60" stroke-width="16" stroke-linecap="round"/>
  <!-- Arco 2 direito — célula -->
  <path d="M 279 148 A 108 108 0 0 1 279 316"
        stroke="white" stroke-opacity="0.60" stroke-width="16" stroke-linecap="round"/>

  <!-- Arco 3 esquerdo — Igreja -->
  <path d="M 233 102 A 154 154 0 0 0 233 362"
        stroke="white" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>
  <!-- Arco 3 direito — Igreja -->
  <path d="M 279 102 A 154 154 0 0 1 279 362"
        stroke="white" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round"/>
</svg>
