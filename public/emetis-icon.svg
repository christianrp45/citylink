<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3FA0"/>
      <stop offset="100%" stop-color="#0B1D4E"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>

  <!--
    Marca "e":
    - Círculo centro (256, 256), raio 113
    - Arco de 270° (sentido anti-horário, large-arc) do ponto superior-direito (336,176)
      passando pelo topo, esquerda e base, até o ponto inferior-direito (336,336)
    - Barra horizontal da borda esquerda (143,256) até o gap (343,256)
    - Ponto âmbar no terminal superior do gap — o beacon de conexão
  -->

  <!-- Taça do "e": arco 270° anti-horário -->
  <path
    d="M 336 176 A 113 113 0 1 0 336 336"
    stroke="white"
    stroke-width="44"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Barra horizontal -->
  <line
    x1="143" y1="256"
    x2="343" y2="256"
    stroke="white"
    stroke-width="44"
    stroke-linecap="round"
  />

  <!--
    Alef (א) — o início, origem da verdade — ponto âmbar pleno
    Tav (ת)  — o fim, conclusão que retorna ao começo — ponto âmbar sutil
    Mem (מ)  — o centro eterno — a barra horizontal acima
  -->
  <circle cx="336" cy="176" r="34" fill="#F59E0B"/>
  <circle cx="336" cy="336" r="20" fill="#F59E0B" opacity="0.45"/>
</svg>
